[project]
# 配布名・import 名を揃える: dist = local-automata-core / import = local_automata_core。
# （汎用名 agent-core は他プロジェクトと衝突するため使用不可。）
name = "local-automata-core"
version = "0.7.20"
description = "エージェント共有コア（L3）。ツールフレームワーク・共通ツール・MCP 連携・エージェントループ・文脈管理。LLM 接続は local-llm-client（L2）に委ね、推論サーバーは別パッケージ local-llm-server。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ToPo-ToPo-ToPo" }]
keywords = ["llm", "agent", "tools", "mcp", "agent-core"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# L2 クライアント（local-llm-client、独立リポジトリ／PyPI）＋ エージェント機能の依存（MCP・PDF・STT 等）。
# 在席セッション（即時アンロード）API が必要なため >=0.3.0 をピン留めする。
dependencies = [
    "local-aios>=0.7.14",
    "local-llm-client>=0.3.0",
    "mcp>=1.27",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "mlx-whisper>=0.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Repository = "https://github.com/ToPo-ToPo-ToPo/local-automata-core"

# local-aios（OS 層）は未公開バージョン（v0.7.12＝desktop シェル）を git タグ固定で参照する。
# PyPI 公開後は [tool.uv.sources] を外せば通常の版指定に切り替わる。
[tool.uv.sources]
local-aios = { git = "https://github.com/ToPo-ToPo-ToPo/local-aios.git", tag = "v0.7.14" }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_automata_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
