[project]
# 配布名・import 名を揃える: dist = local-automata-core / import = local_automata_core。
# （汎用名 agent-core は他プロジェクトと衝突するため使用不可。）
name = "local-automata-core"
version = "0.7.21"
description = "エージェント構築用の共有ツールキット。汎用ツール・MCP 連携・設定・文脈管理。LLM 接続は local-llm-client に委ね、推論サーバーは別パッケージ local-llm-server。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ToPo-ToPo-ToPo" }]
keywords = ["llm", "agent", "tools", "mcp", "agent-core"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# local-llm-client（PyPI）は在席セッション API が必要なため >=0.3.0。
dependencies = [
    "local-llm-client>=0.3.0",
    "mcp>=1.27",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "mlx-whisper>=0.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# OS ゲートウェイ機能（build_mcp）は local-aios を実行時にサブプロセス起動する（import 依存なし）。
# local-aios は PyPI 非公開のため必須依存にはできない。ゲートウェイを使う場合のみ、
# 利用者が各自のソース（private git 等）から入れる。
[project.optional-dependencies]
gateway = ["local-aios>=0.7.15"]

[project.urls]
Repository = "https://github.com/ToPo-ToPo-ToPo/local-automata-core"

# local-aios は兄弟配置の作業ツリーを editable 参照する（日常開発モード。作業ツリーの編集が即反映され、
# タグ pin 事故を構造的に防ぐ）。兄弟リポは開発環境の bootstrap スクリプトが clone/更新する。
# この [tool.uv.sources] は uv 専用でありビルド成果物の依存メタデータには含まれない（公開物に漏れない）。
[tool.uv.sources]
local-aios = { path = "../local-aios", editable = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_automata_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
