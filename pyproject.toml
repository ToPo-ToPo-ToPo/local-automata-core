# local-automata-core — エージェント共有コアの uv workspace（モノレポ）。
# 2 パッケージ: local-llm-client（L2: ゲートウェイ接続クライアント）と
# local-automata-core（L3: ツール・MCP・エージェントループ、import 名 local_automata_core）。
# サーバー（ゲートウェイ）は別リポジトリ local-llm-server。
[tool.uv.workspace]
members = ["packages/*"]

# ワークスペース内のクロス依存はローカルのメンバーを editable で解決する。
[tool.uv.sources]
local-llm-client = { workspace = true }
local-automata-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]
